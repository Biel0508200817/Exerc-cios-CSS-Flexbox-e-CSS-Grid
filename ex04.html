<!DOCTYPE html>
<html lang="en">
<head>
    <<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4: Torre Pokémon</title>
    <link rel="stylesheet" href="css/ex04.css">
    
    <!-- Importando Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonte Pixelada -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --gba-purple: #584e96;
            --gba-purple-dark: #403875;
            --screen-bg: #e0f0e3;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', cursive;
            overflow-x: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* --- ESTILOS DO CONSOLE --- */
        .gba-body {
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 -10px 20px rgba(0,0,0,0.2);
        }
        
        .retro-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .retro-scrollbar::-webkit-scrollbar-track {
            background: #c8dccb;
        }
        .retro-scrollbar::-webkit-scrollbar-thumb {
            background-color: #584e96;
            border: 2px solid #c8dccb;
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        .btn-push:active {
            transform: scale(0.90);
            box-shadow: inset 0px 4px 10px rgba(0,0,0,0.5);
        }

        /* --- ESTILOS DO EXERCÍCIO 4 --- */
        .pokemon-tower {
            background-color: rgba(255, 255, 255, 0.5);
            /* Textura de tijolos para parecer uma torre */
            background-image: 
                linear-gradient(335deg, rgba(0,0,0,0.1) 23px, transparent 23px),
                linear-gradient(155deg, rgba(0,0,0,0.1) 23px, transparent 23px),
                linear-gradient(335deg, rgba(0,0,0,0.1) 23px, transparent 23px),
                linear-gradient(155deg, rgba(0,0,0,0.1) 23px, transparent 23px);
            background-size: 58px 58px;
            background-position: 0px 2px, 4px 35px, 29px 31px, 34px 6px;
            
            border: 2px solid #584e96;
            border-radius: 4px;
            
            /* Altura fixa necessária para ver o espaçamento vertical */
            height: 280px; 
            width: 100%;
            margin-bottom: 1rem;
            padding: 10px;
            
            /* --- SOLUÇÃO DO EXERCÍCIO --- */
            display: flex;
            
            /* Muda a direção para vertical (pilha) */
            flex-direction: column; 
            
            /* Agora o justify-content funciona na VERTICAL */
            justify-content: space-between; 
            
            /* O align-items agora funciona na HORIZONTAL (centraliza os cards) */
            align-items: center;
        }

        .poke-card {
            background: white;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 4px;
            text-align: center;
            width: 100px; /* Um pouco mais largo para a torre */
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.1s;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .poke-card:hover {
            transform: scale(1.05);
            border-color: #ff0055;
            z-index: 10;
        }

        .poke-img {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }
        
        .poke-info {
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="gba-body relative w-full max-w-[800px] aspect-[16/10] md:aspect-[3/2] bg-[#584e96] rounded-[40px] md:rounded-[60px] flex flex-col md:flex-row items-center justify-between p-4 md:p-8 border-b-8 border-[#403875]">
        
        <!-- Decorativos Topo -->
        <div class="absolute -top-4 left-12 w-24 h-8 bg-gray-400 rounded-t-lg -z-10 border-2 border-b-0 border-gray-600"></div>
        <div class="absolute -top-4 right-12 w-24 h-8 bg-gray-400 rounded-t-lg -z-10 border-2 border-b-0 border-gray-600"></div>

        <!-- D-PAD -->
        <div class="w-full md:w-1/4 h-full flex flex-col items-center justify-center order-2 md:order-1 mt-4 md:mt-0">
            <div class="relative w-32 h-32">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-10 h-32 bg-gray-300 rounded shadow-lg"></div>
                <div class="absolute top-1/2 left-0 -translate-y-1/2 w-32 h-10 bg-gray-300 rounded shadow-lg"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 bg-gray-200 rounded-full">
                    <div class="w-8 h-8 bg-gray-300 rounded-full m-1 shadow-inner"></div>
                </div>
                <button class="btn-push absolute top-0 left-1/2 -translate-x-1/2 w-10 h-10 hover:bg-gray-400 rounded-t"></button>
                <button class="btn-push absolute bottom-0 left-1/2 -translate-x-1/2 w-10 h-10 hover:bg-gray-400 rounded-b"></button>
                <button class="btn-push absolute top-1/2 left-0 -translate-y-1/2 w-10 h-10 hover:bg-gray-400 rounded-l"></button>
                <button class="btn-push absolute top-1/2 right-0 -translate-y-1/2 w-10 h-10 hover:bg-gray-400 rounded-r"></button>
            </div>
        </div>

        <!-- TELA -->
        <div class="relative w-full md:w-2/4 h-full flex flex-col items-center order-1 md:order-2">
            <div class="w-full bg-[#33333a] rounded-t-[20px] rounded-b-[40px] p-4 md:p-5 shadow-inner flex flex-col items-center h-full">
                
                <div class="w-full flex justify-between items-center mb-1 px-2">
                    <span class="text-[10px] text-gray-500 font-bold">BATTERY</span>
                    <div class="w-2 h-2 bg-red-500 rounded-full shadow-[0_0_5px_red] animate-pulse"></div>
                </div>

                <div class="relative w-full h-full bg-[#e0f0e3] border-4 border-gray-600 rounded shadow-inner overflow-hidden flex flex-col">
                    <div class="scanlines absolute inset-0 z-10 pointer-events-none"></div>
                    
                    <div class="absolute inset-0 p-3 overflow-y-auto retro-scrollbar z-0">
                        
                        <h1 class="text-[10px] md:text-xs text-[#2d3748] text-center border-b-2 border-[#2d3748] pb-2 mb-3 uppercase font-bold">
                            Exercício 4: Torre Pokémon
                        </h1>

                        <!-- EXERCÍCIO 4 -->
                        <div class="pokemon-tower">
                            <!-- Turtwig -->
                            <div class="poke-card">
                                <a href="https://www.smogon.com/dex/sv/pokemon/machamp/">
                                     <img src="img/ex04/machop.png" alt="Machop" class="poke-img">
                                <div class="poke-info">
                                    <p class="text-[6px] text-black font-bold">Machop</p>
                                </a>
                                </div>
                            </div>
                            <!-- Chimchar -->
                            <div class="poke-card">
                                <a href="https://www.smogon.com/dex/sv/pokemon/geodude/">
                                     <img src="img/ex04/geodude.png" alt="Geodude" class="poke-img">
                                <div class="poke-info">
                                    <p class="text-[6px] text-black font-bold">Geodude</p>
                                </a>
                                </div>
                            </div>
                            <!-- Piplup -->
                            <div class="poke-card">
                                <a href="https://www.smogon.com/dex/sv/pokemon/onix/">
                                    <img src="img/ex04/onix.png" alt="Onix" class="poke-img">
                                <div class="poke-info">
                                    <p class="text-[6px] text-black font-bold">Onix</p>
                                </a>
                                </div>
                            </div>
                        </div>

                        <a href="index.html" class="block text-center bg-[#2d3748] text-white text-[8px] py-2 rounded hover:bg-[#4a5568] active:translate-y-1">
                            < PRESS B TO RETURN
                        </a>
                        <div class="h-4"></div>
                    </div>
                </div>
            </div>

            <div class="mt-2 flex gap-4">
                <div class="w-12 h-4 bg-gray-300 rounded-full transform rotate-12 border border-gray-400"></div>
                <div class="w-12 h-4 bg-gray-300 rounded-full transform rotate-12 border border-gray-400"></div>
            </div>
        </div>

        <!-- BOTÕES -->
        <div class="w-full md:w-1/4 h-full flex flex-col items-center justify-center relative order-3 mt-4 md:mt-0">
            <div class="relative w-32 h-24 transform -rotate-12">
                <button class="btn-push absolute top-0 right-0 w-12 h-12 bg-gray-300 rounded-full shadow-lg border-b-4 border-gray-400 text-xs font-bold text-gray-500 flex items-center justify-center">A</button>
                <a href="index.html" class="btn-push absolute bottom-0 left-0 w-12 h-12 bg-red-400 rounded-full shadow-lg border-b-4 border-red-600 text-xs font-bold text-white flex items-center justify-center no-underline">B</a>
            </div>
        </div>
        
    </div>

</body>
</html>
